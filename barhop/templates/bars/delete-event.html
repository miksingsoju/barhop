{% extends 'base.html' %}
{% load static %}

{% block title %}
  Delete Event | {{ event.title }}
{% endblock %}

{% block content %}
<div class="d-flex flex-column flex-column-fluid py-10">
    <div class="container-xxl">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-xl-5">
                
                <div class="card shadow-sm border-0">
                    <div class="card-body p-10 p-lg-15 text-center">
                        
                        <div class="mb-8">
                            <i class="ki-solid ki-information-5 text-danger fs-5x"></i>
                        </div>

                        <h2 class="fw-bold text-gray-900 mb-4">Delete Event?</h2>
                        
                        <div class="text-gray-600 fw-semibold fs-5 mb-10">
                            Are you sure you want to delete <span class="text-gray-800 fw-bold">"{{ event.title }}"</span>? 
                            <br>This action cannot be undone.
                        </div>

                        <form method="POST" class="d-flex flex-stack justify-content-center gap-5">
                            {% csrf_token %}
                            
                            <a href="{% url 'bars:bar-details' event.bar.id %}" class="btn btn-light fw-bold px-8">
                                No, Cancel
                            </a>

                            <button type="submit" class="btn btn-danger fw-bold px-8">
                                <span class="indicator-label">
                                    Yes, Delete Event
                                    <i class="ki-solid ki-trash fs-4 ms-2"></i>
                                </span>
                            </button>
                        </form>

                    </div>
                </div>
                </div>
        </div>
    </div>
</div>
{% endblock %}
