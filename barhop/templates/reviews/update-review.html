{% extends 'base.html' %}

{% block content %}
  <div class="container d-flex justify-content-center py-12">
    
    <div class="card p-8 w-100 mw-600px">
      <h2 class="mb-8">Edit Review</h2>
      
      <form method="POST" class="d-flex flex-column gap-6">
        {% csrf_token %}
        
        <div class="fv-row">
          {{ form.as_p }}
        </div>

        <div class="d-flex justify-content-end gap-3 mt-4">
          <a href="{% url 'bars:bar-details' review.review_bar.id %}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-info">Save Changes</button>
        </div>
      </form>
      
    </div>
  </div>
{% endblock %}
